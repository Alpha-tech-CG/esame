<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#bcd8f2" />
  <title>BudgetShare</title>

  <!-- Manifeste PWA (installation sur mobile) -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BudgetShare" />

  <!-- Police Geist + styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-logo">
      <span class="brand-mark lg"><i data-lucide="wallet"></i></span>
      <h1>BudgetShare</h1>
      <p>Chargement…</p>
    </div>
  </div>

  <!-- Librairies Firebase (CDN, version « compat ») -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <!-- Icônes Lucide -->
  <script src="https://unpkg.com/lucide@1.80.0/dist/umd/lucide.min.js"></script>
  <!-- Configuration + utilitaires -->
  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>

  <script>
    // Point d'entrée de l'application.
    // 1. On enregistre le service worker (PWA + hors ligne).
    // 2. On regarde si l'utilisateur est déjà connecté.
    //    - Oui -> on va au tableau de bord.
    //    - Non -> on va à la page de connexion.
    registerServiceWorker();

    // Firebase restaure la session de façon asynchrone : on attend
    // le premier événement d'authentification avant de rediriger.
    window.auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.replace("./dashboard.html");
      } else {
        window.location.replace("./login.html");
      }
    });
  </script>
</body>
</html>
